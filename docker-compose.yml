services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_DATA_DIR: /var/lib/gecko
      APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-2147483648}
      HF_HOME: /var/cache/huggingface
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - gecko_data:/var/lib/gecko
      - model_cache:/var/cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_DATA_DIR: /var/lib/gecko
      HF_HOME: /var/cache/huggingface
    volumes:
      - gecko_data:/var/lib/gecko
      - model_cache:/var/cache/huggingface
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_TARGET: http://api:8000
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - ./fixtures:/workspace/fixtures:ro
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

volumes:
  gecko_data:
  model_cache:
  frontend_node_modules:
