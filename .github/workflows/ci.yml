name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: python fixtures/validate_manifest.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail --silent --show-error http://localhost:8000/openapi.json > /dev/null
      - run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:5173/api/v1/jobs/not-a-uuid)" = "422"
      - if: always()
        run: docker compose down
